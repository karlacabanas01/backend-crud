version: "3.8"

services:
  backend:
    build: .
    container_name: nabi_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
    - nabi-network

networks:
  nabi-network:
    external: true